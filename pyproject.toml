[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdiet"
version = "0.1.0"
description = "A Python library for generating synthetic patients with realistic clinical conditions and simulating dietary interventions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Buğra Ayan", email = "bugraayan.com@gmail.com" }
]
maintainers = [
    { name = "Buğra Ayan", email = "bugraayan.com@gmail.com" }
]
keywords = [
    "dietetics",
    "nutrition",
    "synthetic-patients",
    "clinical-simulation",
    "diet-simulation",
    "healthcare",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.1",
    "sphinx-autodoc-typehints>=1.25",
]
causal = [
    "networkx>=3.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://bugraayan.com"
Author = "https://bugraayan.com"
"Google Scholar" = "https://scholar.google.com/citations?user=VHGqzNMAAAAJ&hl=tr"
Repository = "https://github.com/bugraayan/synthdiet"
Issues = "https://github.com/bugraayan/synthdiet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synthdiet = ["py.typed", "data/*.csv", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: marks tests as slow (RCT validation runs)",
]
